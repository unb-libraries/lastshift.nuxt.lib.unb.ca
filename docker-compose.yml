services:
  lastshift-lib-unb-ca:
    build:
      target: development
      context: .
    container_name: lastshift-lib-unb-ca
    volumes:
      - ./.nuxt:/nuxt/.nuxt
      - ./app:/nuxt/app
      - ./public:/nuxt/public
      - ./nuxt.config.ts:/nuxt/nuxt.config.ts
      - ./package.json:/nuxt/package.json
      - ./pnpm-lock.yaml:/nuxt/pnpm-lock.yaml
    environment:
      NUXT_SITE_URI: ${NUXT_SITE_URI}
      NUXT_PORT: ${NUXT_PORT}
    ports:
      - '3112:3112'
      - '31120:31120'
    networks:
      - lastshift.lib.unb.ca

networks:
  lastshift.lib.unb.ca:
    name: lastshift.lib.unb.ca
